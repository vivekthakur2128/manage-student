<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Panel Login</title>
     <link rel="stylesheet" href="../tailwind.min.css">
    <link rel="stylesheet" href="login.css">
  </head>
  <body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-sm p-6 py-10 bg-blue-300 bg-opacity-20 rounded-2xl shadow-lg">
      <h2 class="text-2xl font-bold text-center text-gray-300 mb-6">
        Admin Panel
      </h2>
      <form class="space-y-4" autocomplete="off">
        <div>
          <label for="userid" class="block text-sm font-medium text-gray-300"
            >User ID</label
          >
          <input
            type="text"
            id="userid"
            name="userid"
            required
            autocomplete="off"
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg bg-blue-100 bg-opacity-10 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-300"
            >Password</label
          >
          <input
            type="text"
            id="password"
            name="password"
            required
            onfocus="this.type='password'"
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg bg-blue-100 bg-opacity-10 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>
        <div class="text-center">
          <button
          id="loginBtn"
          type="button"
          class="w-48 px-4 py-2 border border-gray-300 bg-blue-100 bg-opacity-20 text-gray-300 text-center font-medium rounded-md hover:bg-blue-300 hover:bg-opacity-40 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition cursor-pointer"
        >
          Login
        </button>
        </div>
        
      </form>
    </div>
    <script src="login.js"></script>
  </body>
</html>
